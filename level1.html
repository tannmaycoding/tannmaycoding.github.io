<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("level_bg/WhatsApp Image 2026-01-19 at 3.48.32 PM (1).jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.55);
            z-index: -1;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 2.2rem;
            font-weight: 700;
            opacity: 0;
            animation: fadeDown 0.8s ease forwards;
        }

        .level-container {
            height: calc(100% - 90px);
            display: flex;
            gap: 30px;
            padding: 30px;
        }

        /* LEFT PANEL */
        #left {
            width: 35%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            gap: 18px;

            opacity: 0;
            transform: translateX(-30px);
            animation: slideInLeft 0.9s ease forwards 0.3s;
        }

        #left h2 {
            font-size: 1.6rem;
        }

        input {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
        }

        /* Scrollable questions */
        .questions {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .riddle {
            background: rgba(255, 255, 255, 0.7);
            padding: 16px;
            border-radius: 14px;

            opacity: 0;
            transform: translateY(20px);
        }

        .riddle.show {
            animation: fadeUp 0.6s ease forwards;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #check {
            background: #432616;
            color: white;
        }

        #back {
            background: #e5e7eb;
            color: #1f2933;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.96);
        }

        /* RIGHT PANEL */
        #right {
            width: 65%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            font-size: 1.4rem;
            color: #432616;
            font-weight: 600;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.9s ease forwards 0.5s;
        }

        #right img {
            max-width: 40%;
            border-radius: 18px;
            margin-top: 15px;
            border: 2px solid #ccc;
            animation: pop 0.6s ease;
        }

        /* Wrong input shake */
        .shake {
            animation: shake 0.4s ease;
            border-color: #ef4444 !important;
        }

        /* ANIMATIONS */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        p {
            color: #432616;
            font-weight: 600;
        }
    </style>
</head>

<body>

<h1>✨ Level 1 ✨</h1>

<div class="level-container">

    <div id="left">
        <h2>🧩 Puzzles: Riddles</h2>

        <div class="questions">
            <div class="riddle">
                <p>What races on orange tracks and fits in your pocket?</p>
                <input data-answer="hot wheels" placeholder="Your answer">
            </div>

            <div class="riddle">
                <p>What do I want more with you and faster without you?</p>
                <input data-answer="time" placeholder="Your answer">
            </div>

            <div class="riddle">
                <p>A ring without jewelry, a circle with no end?</p>
                <input data-answer="hug" placeholder="Your answer">
            </div>

            <div class="riddle">
                <p>The little brother of racing, inches from the track?</p>
                <input data-answer="go karting" placeholder="Your answer">
            </div>
        </div>

        <div class="buttons">
            <button id="check">Check</button>
            <button id="back">Back</button>
        </div>
    </div>

    <div id="right">
        ✨ Your result will appear here ✨
    </div>

</div>

<script>
    document.getElementById('back').onclick = () => location.href = 'game.html';

    // Stagger riddles
    const riddles = document.querySelectorAll('.riddle');
    riddles.forEach((r, i) => {
        setTimeout(() => r.classList.add('show'), i * 200);
    });

    document.getElementById('check').onclick = () => {
        const inputs = document.querySelectorAll('.riddle input');
        let allCorrect = true;

        inputs.forEach(input => {
            input.classList.remove('shake');
            if (input.value.trim().toLowerCase() !== input.dataset.answer) {
                allCorrect = false;
                input.classList.add('shake');
            }
        });

        document.getElementById('right').innerHTML = allCorrect
            ? `<div><h2>🎉 All Correct!</h2><img src="puzzle_img/1000088867.png"></div>`
            : `<h2>❌ Some answers are incorrect</h2>`;
    };
</script>

</body>
</html>
