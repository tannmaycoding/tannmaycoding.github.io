<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("level_bg/WhatsApp Image 2026-01-19 at 3.48.32 PM.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.55);
            z-index: -1;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-weight: 700;
            opacity: 0;
            animation: fadeDown 0.8s ease forwards;
        }

        .level-container {
            height: calc(100% - 90px);
            display: flex;
            gap: 30px;
            padding: 30px;
        }

        /* LEFT PANEL */
        #left {
            width: 40%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            gap: 12px;

            opacity: 0;
            transform: translateX(-30px);
            animation: slideInLeft 0.9s ease forwards 0.3s;
        }

        #left h2 {
            font-size: 1.5rem;
        }

        #left img {
            width: 70%;
            align-self: center;
            object-fit: contain;
            border-radius: 14px;

            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s ease forwards 0.8s;
        }

        .bottom {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;

            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s ease forwards 1.1s;
        }

        input {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #check {
            background: #432616;
            color: white;
            
        }

        #back {
            background: #e5e7eb;
            color: #1f2933;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.96);
        }

        /* RIGHT PANEL */
        #right {
            width: 60%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.4rem;
            flex-direction: column;
            gap: 12px;
            color: #432616;
      font-weight: 600;

            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.9s ease forwards 0.5s;
        }

        #right img {
            max-width: 40%;
            border-radius: 18px;
            margin-top: 10px;
        }

        .pop {
            animation: pop 0.6s ease;
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ANIMATIONS */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        #answer {
            color: #432616;
            font-weight: 600;
        }
    </style>
</head>

<body>

<h1>✨ Level 3 ✨</h1>

<div class="level-container">

    <div id="left">
        <div class="top">
            <h2>🔍 Puzzle: Word Search</h2>
            <p><strong>Find 5 Words</strong></p>
        </div>

        <img src="puzzle_img/ws.png" alt="Word Search">

        <div class="bottom">
            <label for="answer"><strong>Enter a Word</strong></label>
            <input type="text" id="answer" placeholder="Type one word">

            <div class="buttons">
                <button id="check">Check</button>
                <button id="back">Back</button>
            </div>
        </div>
    </div>

    <div id="right">
        ✨ Found words will appear here ✨
    </div>

</div>

<script>
    let answersFound = 0;
    let correctAnswers = ['speziabistro', 'batman', 'vangogh', 'bodam', 'naraina-vihar'];

    document.getElementById('back').onclick = () => location.href = 'game.html';

    document.getElementById("answer").addEventListener("keypress", e => {
        if (e.key === "Enter") document.getElementById("check").click();
    });

    document.getElementById('check').onclick = () => {
        const right = document.getElementById('right');
        const input = document.getElementById('answer');

        right.classList.remove('pop', 'shake');

        const userAnswer = input.value.toLowerCase().trim();
        input.value = '';

        if (!userAnswer) return;

        if (correctAnswers.includes(userAnswer)) {
            answersFound++;
            correctAnswers = correctAnswers.filter(a => a !== userAnswer);
            right.innerHTML = `<h2>✅ You found <strong>${userAnswer}</strong>!</h2>`;

            if (answersFound === 5) {
                right.innerHTML = `
                    <h2 class="pop">🎉 Congratulations!</h2>
                    <p class="pop">You found all words!</p>
                    <img class="pop" src="puzzle_img/1000088866.png" alt="Reward Image">`;
            }
        } else {
            right.classList.add('shake');
            right.innerHTML = `<h2>❌ Incorrect or already found!</h2>`;
        }
    };
</script>

</body>
</html>
