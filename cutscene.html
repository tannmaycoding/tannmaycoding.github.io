<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cutscene</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

/* Video */
video {
  width: auto;
  height: 100%;
  display: block;
  margin: 0 auto;
}

/* Fade overlay */
#fade {
  position: fixed;
  inset: 0;
  background: black;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}

/* Start overlay */
#start {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 1.4rem;
  cursor: pointer;
  z-index: 2;
}

/* Skip */
#skip {
  position: absolute;
  bottom: 25px;
  right: 30px;
  color: white;
  font-size: 1rem;
  opacity: 0.7;
  cursor: pointer;
  z-index: 3;
}
#skip:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div id="start">▶ Tap to Start</div>

<video id="cutscene" muted playsinline>
  <source src="level_bg/cutscene.mp4" type="video/mp4">
</video>

<div id="skip">Skip ▶</div>
<div id="fade"></div>

<script>
const video = document.getElementById("cutscene");
const start = document.getElementById("start");
const fade = document.getElementById("fade");

start.onclick = () => {
  start.style.display = "none";
  video.muted = false;   // 🔊 audio allowed now
  video.play();
};

video.onended = () => {
  goToGame();
};

document.getElementById("skip").onclick = () => {
  goToGame();
};

function goToGame() {
  fade.style.opacity = "1"; // fade to black
  setTimeout(() => {
    window.location.href = "game.html";
  }, 1000);
}
</script>

</body>
</html>
