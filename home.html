<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game 🎉</title>

    <!-- Google Font -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet"> -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
              font-family: "Dancing Script", cursive;
  font-optical-sizing: auto;

  font-style: normal;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: lightyellow;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: popIn 0.8s ease;
            max-width: 420px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #432616;
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            color: #374151;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 30px;
            color: #555;
        }

        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            background: #432616;
            color: white;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: scale(0.96);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        img {
            max-width: 100%;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hi There!!!</h1>
        <h2>Let me take you to an yearly round up!!! </h2>
        <img src="level_bg/unnamed.png" alt="Batman Holding Hands Of A Cute Dinosaur">

        <button onclick="window.location.href='cutscene.html'">
            ▶ Play Now
        </button>
    </div>
</body>

</html>
